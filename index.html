<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺中慈濟醫院中醫部 - 綜合行事曆</title>
  
  <!-- Tailwind CSS 樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 與 Supabase SDK -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* 🖨️ 平常在螢幕上隱藏列印專屬表格 */
    .print-only { display: none !important; }

    /* 🖨️ 列印時的 Excel 極簡黑白風格 */
    @media print {
      @page {
        size: landscape;
        margin: 6mm;
      }
      .no-print { display: none !important; }
      .screen-only { display: none !important; }
      .print-only { display: block !important; }

      body { 
        background-color: white !important; 
        padding: 0 !important; 
        margin: 0 !important; 
        font-size: 11px !important;
        color: #000000 !important;
        font-family: Arial, "Microsoft JhengHei", sans-serif !important;
      }
      
      .excel-table {
        width: 100% !important;
        border-collapse: collapse !important;
        border: 1.5px solid #000000 !important;
        table-layout: fixed !important;
        margin-top: 6px !important;
      }
      .excel-table th, .excel-table td {
        border: 1px solid #000000 !important;
        padding: 4px 6px !important;
        text-align: left !important;
        vertical-align: top !important;
        background: transparent !important;
        color: #000000 !important;
      }
      .excel-table th {
        background-color: #f3f4f6 !important;
        font-weight: bold !important;
        text-align: center !important;
      }
      .excel-grid-cell {
        border: 1px solid #000000 !important;
        vertical-align: top !important;
        padding: 4px !important;
        height: auto !important; 
        min-height: 100px !important;
        page-break-inside: avoid !important;
      }
      .print-title {
        display: block !important;
        text-align: center;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #000000 !important;
      }
      * {
        box-shadow: none !important;
        border-radius: 0 !important;
        text-shadow: none !important;
      }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-3 md:p-8 font-sans">
  <div id="root"></div>

  <!-- 1. 核心組態與純工具函式 (標準 JS，同步載入) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>

  <!-- 2. UI 元件模組 (JSX，由 Babel 即時轉譯) -->
  <script type="text/babel" src="js/components/Header.js"></script>
  <script type="text/babel" src="js/components/Navbar.js"></script>
  <script type="text/babel" src="js/components/TodayTab.js"></script>
  <script type="text/babel" src="js/components/CalendarTab.js"></script>
  <script type="text/babel" src="js/components/RosterTab.js"></script>
  <script type="text/babel" src="js/components/PersonnelTab.js"></script>
  <script type="text/babel" src="js/components/CoursesTab.js"></script>
  <script type="text/babel" src="js/components/RulesTab.js"></script>
  <script type="text/babel" src="js/components/BulletinTab.js"></script>
  <script type="text/babel" src="js/components/Modals.js"></script>

  <!-- 3. 主應用程式進入點 -->
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
